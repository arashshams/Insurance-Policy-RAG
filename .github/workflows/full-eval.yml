name: full-eval

# Full evaluation on demand (Actions tab -> full-eval -> Run workflow).
# Not scheduled: the generator is pinned, so re-measuring an unchanged system
# would only spend quota. Answer and judge caches persist between runs (GitHub
# cache), so a run that stops on the daily quota continues next time. The
# report is uploaded as an artifact; committing it stays a deliberate step.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max generation calls for answers this run"
        default: "15"
      judge:
        description: "Also run the LLM judge"
        type: boolean
        default: false
      judge_max_calls:
        description: "Max judge calls this run"
        default: "15"

concurrency:
  group: full-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAX_CALLS: ${{ inputs.max_calls }}
      JUDGE_MAX_CALLS: ${{ inputs.judge_max_calls }}
    steps:
      - name: Require the API key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Add the GEMINI_API_KEY repository secret first."; exit 1; fi
          case "$MAX_CALLS$JUDGE_MAX_CALLS" in (*[!0-9]*|'') echo "::error::max calls must be whole numbers"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore answer and judge caches
        uses: actions/cache/restore@v4
        with:
          path: |
            eval/questions_v2_results.json
            eval/questions_v2_judge.json
          key: eval-cache-${{ github.run_id }}
          restore-keys: eval-cache-
      - name: Answer questions
        run: |
          set +e
          python -m src.evaluate --max-calls "$MAX_CALLS" --sleep 6 --no-report
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Judge answers
        if: inputs.judge
        run: |
          set +e
          python -m src.judge --max-calls "$JUDGE_MAX_CALLS" --sleep 6
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Report (no API calls; only once every question has an answer)
        run: |
          set +e
          python -m src.evaluate --max-calls 0
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            eval/questions_v2_results.json
            eval/questions_v2_judge.json
          key: eval-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: ignore
