name: full-eval

# Full evaluation on demand (Actions tab -> full-eval -> Run workflow).
# Not scheduled: the generator is pinned, so re-measuring an unchanged system
# would only spend quota. Answer and judge caches persist between runs (GitHub
# cache), so a run that stops on the daily quota continues next time. The
# report is uploaded as an artifact; committing it stays a deliberate step.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max generation calls for answers this run"
        default: "15"
      judge:
        description: "Also run the LLM judge"
        type: boolean
        default: false
      judge_max_calls:
        description: "Max judge calls this run"
        default: "15"
      gen_model:
        description: "Generator to evaluate instead of the pinned one (e.g. gemini-3.6-flash); empty = pinned"
        default: ""
      judge_model:
        description: "Judge model instead of the default (gemma-4-31b-it); must differ from the generator (D4); empty = default"
        default: ""

concurrency:
  group: full-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAX_CALLS: ${{ inputs.max_calls }}
      JUDGE_MAX_CALLS: ${{ inputs.judge_max_calls }}
      GEN_MODEL_OVERRIDE: ${{ inputs.gen_model }}
      JUDGE_MODEL_OVERRIDE: ${{ inputs.judge_model }}
      RUN_JUDGE: ${{ inputs.judge }}
    steps:
      - name: Require the API key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Add the GEMINI_API_KEY repository secret first."; exit 1; fi
          case "$MAX_CALLS$JUDGE_MAX_CALLS" in (*[!0-9]*|'') echo "::error::max calls must be whole numbers"; exit 1;; esac
          case "$GEN_MODEL_OVERRIDE$JUDGE_MODEL_OVERRIDE" in (*[!a-z0-9.-]*) echo "::error::model names use only lowercase letters, digits, dots and dashes"; exit 1;; esac
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Choose models
        # Answers and judgments are cached per model, so switching models
        # never mixes them up; every later step sees the same choice.
        run: |
          if [ -n "$GEN_MODEL_OVERRIDE" ]; then
            echo "INSURANCE_RAG_GEN_MODEL=$GEN_MODEL_OVERRIDE" >> "$GITHUB_ENV"
            export INSURANCE_RAG_GEN_MODEL="$GEN_MODEL_OVERRIDE"
          fi
          if [ -n "$JUDGE_MODEL_OVERRIDE" ]; then
            echo "INSURANCE_RAG_JUDGE_MODEL=$JUDGE_MODEL_OVERRIDE" >> "$GITHUB_ENV"
            export INSURANCE_RAG_JUDGE_MODEL="$JUDGE_MODEL_OVERRIDE"
          fi
          python - <<'PY'
          import os, sys
          from src import judge as jd, rag_pipeline as rp
          line = f"Generator: `{rp.GEN_MODEL}`; judge: `{jd.JUDGE_MODEL}`"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(line + "\n\n")
          if os.environ.get("RUN_JUDGE") == "true" and jd.JUDGE_MODEL == rp.GEN_MODEL:
              print("::error::The judge must differ from the generator (PLAN.md D4): "
                    "set the judge_model input.")
              sys.exit(1)
          PY
      - name: Restore answer and judge caches
        uses: actions/cache/restore@v6
        with:
          path: |
            eval/questions_v2_results.json
            eval/questions_v2_judge.json
          key: eval-cache-${{ github.run_id }}
          restore-keys: eval-cache-
      - name: Answer questions
        run: |
          set +e
          python -m src.evaluate --max-calls "$MAX_CALLS" --sleep 6 --no-report
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Judge answers
        if: inputs.judge
        run: |
          set +e
          python -m src.judge --max-calls "$JUDGE_MAX_CALLS" --sleep 6
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Report (no API calls; only once every question has an answer)
        run: |
          set +e
          python -m src.evaluate --max-calls 0
          code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
      - name: Save caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            eval/questions_v2_results.json
            eval/questions_v2_judge.json
          key: eval-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: ignore
