name: tests

on:
  push:
    branches: [master, new_dev]
  pull_request:

jobs:
  offline-tests:
    # No API key and no network calls to Gemini: embeddings/generation are faked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Tests
        run: pytest -q tests/
