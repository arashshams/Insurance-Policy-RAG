# Lint configuration (ruff). Run: ruff check .
target-version = "py311"
line-length = 100
# Notebooks contain Colab shell/magic lines (!pip, %cd) and are linted by eye.
extend-exclude = ["notebooks"]

[lint]
# Ruff defaults: pyflakes (F) + the pycodestyle errors (E4, E7, E9).
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Imports after setup code on purpose:
# - app: st.set_page_config() must be the first Streamlit call, and src/ is
#   added to sys.path first;
# - rag_pipeline: the module is laid out in sections, each importing what it uses.
"app/streamlit_app.py" = ["E402"]
"src/rag_pipeline.py" = ["E402"]
